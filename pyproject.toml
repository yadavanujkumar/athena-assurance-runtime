[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-assurance-runtime"
version = "0.1.0"
description = "Autonomous assurance runtime for software and AI-enabled systems"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "ATHENA contributors"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6"
]

[project.scripts]
athena = "athena.cli:main"

[tool.setuptools.packages.find]
include = ["athena*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F"]
